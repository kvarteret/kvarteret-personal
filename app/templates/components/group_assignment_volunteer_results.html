{% if query %}
  {% if volunteers %}
    <fieldset class="grid gap-3">
      <legend class="text-sm font-medium text-stone-900">Velg frivillig</legend>
      {% for volunteer in volunteers %}
        <div class="grid gap-3 rounded-2xl border border-stone-200 bg-kvarteret-surface/95 p-4 shadow-sm transition hover:border-kvarteret-red/40 hover:shadow-md md:grid-cols-[minmax(0,1fr)_auto] md:items-center">
          <label class="grid min-w-0 cursor-pointer gap-3 md:grid-cols-[auto_minmax(0,1fr)] md:items-center">
            <input class="mt-1 h-4 w-4 shrink-0 accent-kvarteret-red md:mt-0" name="volunteer_id" required type="radio" value="{{ volunteer.volunteer_id }}">
            <div class="flex min-w-0 items-start gap-3">
              <div class="grid h-12 w-12 shrink-0 place-items-center overflow-hidden rounded-sm bg-stone-300 text-sm font-semibold text-stone-600">
                {% if volunteer.photo_url %}
                  <img alt="{{ volunteer.full_name }}" class="h-full w-full object-cover" decoding="async" fetchpriority="low" loading="lazy" src="{{ volunteer.photo_url }}">
                {% else %}
                  {{ volunteer.last_name[:1] }}
                {% endif %}
              </div>
              <div class="grid min-w-0 gap-1 text-sm text-stone-700">
                <span class="font-medium text-stone-900">{{ volunteer.full_name }}</span>
                <span class="break-words">{{ volunteer.email or "Ingen e-post" }}{% if volunteer.phone %} · {{ volunteer.phone }}{% endif %}</span>
                {% if volunteer.last_semester_label %}
                  <span class="text-stone-500">Sist registrert {{ volunteer.last_semester_label }}</span>
                {% endif %}
              </div>
            </div>
          </label>
          <a class="app-button-secondary min-h-9 px-3 py-2 text-xs no-underline md:self-start" href="/volunteers/{{ volunteer.volunteer_id }}">Se profil</a>
        </div>
      {% endfor %}
    </fieldset>
  {% else %}
    <p class="text-sm text-stone-600">Ingen frivillige matchet "{{ query }}".</p>
  {% endif %}
{% else %}
  <p class="text-sm text-stone-600">Søk etter en frivillig for å velge hvem som skal legges inn i gruppen.</p>
{% endif %}
