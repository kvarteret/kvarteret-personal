<section class="app-panel">
  <div class="grid gap-6 md:grid-cols-2">
    <div>
      <h2 class="text-2xl font-medium tracking-tight text-stone-900">Kort</h2>
      <div class="mt-5 grid gap-3">
        {% for card in cards %}
          <div class="border-b border-stone-300 pb-3 text-stone-800">{{ card.card_number }}</div>
        {% else %}
          <p class="text-sm text-stone-600">Ingen kort registrert.</p>
        {% endfor %}
      </div>
    </div>
    <div>
      <h2 class="text-2xl font-medium tracking-tight text-stone-900">Pårørende</h2>
      <div class="mt-5 grid gap-3">
        {% for item in next_of_kin %}
          <div class="border-b border-stone-300 pb-3">
            <div class="text-stone-900">{{ item.name }}</div>
            <div class="text-sm text-stone-600">{{ item.phone }}</div>
          </div>
        {% else %}
          <p class="text-sm text-stone-600">Ingen pårørende registrert.</p>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
