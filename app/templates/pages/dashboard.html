{% extends "layouts/base.html" %}

{% block page_content %}
  <section class="mx-auto grid max-w-5xl gap-5">
    <div class="grid gap-5 md:grid-cols-2">
      <a class="grid min-h-40 place-items-center bg-kvarteret-red p-6 text-center text-white no-underline shadow-md transition hover:bg-red-700" href="/volunteers" preload="mouseover">
        <div>
          <h2 class="text-4xl font-light tracking-tight">Frivillige</h2>
        </div>
      </a>
      <a class="grid min-h-40 place-items-center bg-kvarteret-red p-6 text-center text-white no-underline shadow-md transition hover:bg-red-700" href="/groups" preload="mouseover">
        <div>
          <h2 class="text-4xl font-light tracking-tight">Grupper</h2>
        </div>
      </a>
      <a class="grid min-h-40 place-items-center bg-kvarteret-red p-6 text-center text-white no-underline shadow-md transition hover:bg-red-700" href="/courses" preload="mouseover">
        <div>
          <h2 class="text-4xl font-light tracking-tight">Kurs</h2>
        </div>
      </a>
      {% if current_user.role == "Admin" %}
        <a class="grid min-h-40 place-items-center bg-kvarteret-red p-6 text-center text-white no-underline shadow-md transition hover:bg-red-700" href="/admin-accounts" preload="mouseover">
          <div>
            <h2 class="text-4xl font-light tracking-tight">Admin-kontoer</h2>
          </div>
        </a>
      {% endif %}
    </div>
  </section>
{% endblock %}
