{% extends "layouts/base.html" %}

{% block page_content %}
  <section class="grid gap-7 max-w-2xl mx-auto">

    <div class="grid gap-6 md:grid-cols-1">
      <a class="grid min-h-44 place-items-center bg-kvarteret-red p-8 text-center text-white no-underline shadow-md transition hover:bg-red-700" href="/people" preload="mouseover">
        <div>
          <h2 class="text-4xl font-light tracking-tight">Personell</h2>
        </div>
      </a>
      <a class="grid min-h-44 place-items-center bg-kvarteret-red p-8 text-center text-white no-underline shadow-md transition hover:bg-red-700" href="/groups" preload="mouseover">
        <div>
          <h2 class="text-4xl font-light tracking-tight">Grupper</h2>
        </div>
      </a>
      <a class="grid min-h-44 place-items-center bg-kvarteret-red p-8 text-center text-white no-underline shadow-md transition hover:bg-red-700" href="/courses" preload="mouseover">
        <div>
          <h2 class="text-4xl font-light tracking-tight">Kurs</h2>
        </div>
      </a>
      {% if current_user.role == "Admin" %}
        <a class="grid min-h-44 place-items-center bg-kvarteret-red p-8 text-center text-white no-underline shadow-md transition hover:bg-red-700" href="/users" preload="mouseover">
          <div>
          <h2 class="text-4xl font-light tracking-tight">Brukere</h2>
          </div>
        </a>
        <a class="grid min-h-44 place-items-center bg-kvarteret-red p-8 text-center text-white no-underline shadow-md transition hover:bg-red-700" href="/registrations" preload="mouseover">
          <div>
            <h2 class="text-4xl font-light tracking-tight">Registreringer</h2>
          </div>
        </a>
      {% endif %}
    </div>

  </section>
{% endblock %}
