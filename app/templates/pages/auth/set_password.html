{% extends "layouts/base.html" %}

{% block page_content %}
  <section class="mx-auto grid w-full max-w-xl gap-6">
    <div class="bg-kvarteret-surface/96 p-8 shadow-[0_28px_70px_-34px_rgba(245,75,75,0.24)] backdrop-blur-sm md:p-12">
      <h1 class="text-4xl leading-none font-light tracking-tight text-kvarteret-ink md:text-5xl">
        Sett passord
      </h1>
      <p class="mt-4 text-sm leading-6 text-kvarteret-sky md:text-base">
        Bruk lenken fra e-posten for å velge et nytt passord.
      </p>

      {% if error_message %}
        <div class="mt-6 bg-kvarteret-red/10 px-4 py-3 text-sm text-kvarteret-night" role="alert">
          {{ error_message }}
        </div>
      {% endif %}

      <div class="mt-6 hidden bg-kvarteret-red/10 px-4 py-3 text-sm text-kvarteret-night" data-missing-token role="alert">
        Password setup link is missing or invalid.
      </div>

      <form action="/set-password" class="mt-8 grid gap-6" data-password-form hx-boost="false" method="post">
        <input name="access_token" type="hidden" value="{{ access_token or '' }}">
        <input name="token_hash" type="hidden" value="{{ token_hash or '' }}">
        <input name="verification_type" type="hidden" value="{{ verification_type or '' }}">
        <label class="grid gap-1">
          <span class="text-sm text-kvarteret-sky">Nytt passord</span>
          <input class="app-input" minlength="8" name="password" required type="password">
        </label>
        <label class="grid gap-1">
          <span class="text-sm text-kvarteret-sky">Bekreft nytt passord</span>
          <input class="app-input" minlength="8" name="confirm_password" required type="password">
        </label>
        <button class="app-button min-h-14 text-lg" type="submit">
          Lagre passord
        </button>
      </form>
    </div>
  </section>

  <script>
    (() => {
      const form = document.querySelector("[data-password-form]");
      if (!(form instanceof HTMLFormElement)) {
        return;
      }
      const tokenField = form.elements.namedItem("access_token");
      const missingTokenAlert = document.querySelector("[data-missing-token]");
      if (!(tokenField instanceof HTMLInputElement)) {
        return;
      }
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const accessToken = hash.get("access_token");
      const tokenHash = hash.get("token_hash");
      const verificationType = hash.get("type");
      if (accessToken) {
        tokenField.value = accessToken;
        window.history.replaceState(null, "", window.location.pathname + window.location.search);
        return;
      }
      const tokenHashField = form.elements.namedItem("token_hash");
      const verificationTypeField = form.elements.namedItem("verification_type");
      if (
        tokenHash &&
        verificationType === "recovery" &&
        tokenHashField instanceof HTMLInputElement &&
        verificationTypeField instanceof HTMLInputElement
      ) {
        tokenHashField.value = tokenHash;
        verificationTypeField.value = verificationType;
        window.history.replaceState(null, "", window.location.pathname + window.location.search);
        return;
      }
      const hasTokenHash = tokenHashField instanceof HTMLInputElement && tokenHashField.value;
      if (!tokenField.value && !hasTokenHash && missingTokenAlert instanceof HTMLElement) {
        missingTokenAlert.classList.remove("hidden");
      }
    })();
  </script>
{% endblock %}
