{% extends "layouts/base.html" %}

{% block page_content %}
  <section class="mx-auto grid w-full max-w-xl justify-items-center gap-5">
    <div class="grid h-32 w-32 place-items-center rounded-full border-4 border-kvarteret-surface/90 bg-kvarteret-red shadow-[0_26px_55px_-30px_rgba(245,75,75,0.82)]">
      <img alt="Det Akademiske Kvarter" class="h-16 w-16 object-contain" src="{{ url_for('static', path='images/internbevis-logo.png') }}">
    </div>

    <div class="w-full bg-kvarteret-surface/96 p-8 shadow-[0_28px_70px_-34px_rgba(245,75,75,0.24)] backdrop-blur-sm md:p-12">
      <h1 class="text-5xl leading-none font-light tracking-tight text-kvarteret-ink md:text-7xl">
        Kvarteret <span class="ml-2 text-3xl text-kvarteret-red md:text-4xl">Intern</span>
      </h1>
      <p class="mt-4 max-w-xl text-sm leading-6 text-kvarteret-sky md:text-base">Logg inn med brukernavn eller e-post.</p>

      {% if error_message %}
        <div class="mt-6 bg-kvarteret-red/10 px-4 py-3 text-sm text-kvarteret-night" role="alert">
          {{ error_message }}
        </div>
      {% endif %}
      {% if message %}
        <div class="mt-6 bg-emerald-100 px-4 py-3 text-sm text-kvarteret-night" role="status">
          {{ message }}
        </div>
      {% endif %}

      <form action="/login" class="mt-8 grid gap-6" hx-boost="false" method="post">
        <input type="hidden" name="next" value="{{ next_path or '/' }}">
        <label class="grid gap-1">
          <span class="text-sm text-kvarteret-sky">Brukernavn</span>
          <input class="app-input" type="text" name="identifier" required>
        </label>
        <label class="grid gap-1">
          <span class="text-sm text-kvarteret-sky">Passord</span>
          <div class="relative">
            <input id="login-password" autocomplete="current-password" class="app-input w-full pr-12" data-login-password name="password" required type="password">
            <button
              aria-controls="login-password"
              aria-pressed="false"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-kvarteret-sky hover:text-kvarteret-ink"
              data-password-toggle
              type="button"
              aria-label="Vis passord"
            >
              <svg data-password-icon="show" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg data-password-icon="hide" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </label>
        <button class="app-button min-h-14 text-lg" type="submit">
          Logg inn
        </button>
      </form>
      <p class="mt-6 text-center text-sm">
        <a class="text-kvarteret-red underline-offset-4 hover:underline" href="/forgot-password">Glemt passord?</a>
      </p>
    </div>
  </section>

  <script>
    (() => {
      const password = document.querySelector("[data-login-password]");
      const toggle = document.querySelector("[data-password-toggle]");
      const showIcon = document.querySelector('[data-password-icon="show"]');
      const hideIcon = document.querySelector('[data-password-icon="hide"]');
      if (!(password instanceof HTMLInputElement) || !(toggle instanceof HTMLButtonElement)) {
        return;
      }

      toggle.addEventListener("click", () => {
        const isVisible = password.type === "text";
        password.type = isVisible ? "password" : "text";
        toggle.setAttribute("aria-pressed", String(!isVisible));
        toggle.setAttribute("aria-label", isVisible ? "Vis passord" : "Skjul passord");
        if (showIcon instanceof SVGElement) showIcon.hidden = !isVisible;
        if (hideIcon instanceof SVGElement) hideIcon.hidden = isVisible;
      });
    })();
  </script>
{% endblock %}
