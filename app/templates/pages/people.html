{% extends "layouts/base.html" %}

{% block content %}
  <section class="space-y-6">
    <header class="space-y-2">
      <p class="text-sm uppercase tracking-[0.2em] text-teal-700">Directory</p>
      <h2 class="text-4xl font-semibold">People</h2>
      <p class="max-w-2xl text-base text-stone-600">
        Search updates as you type, and the directory only loads ten people at a time.
      </p>
    </header>

    <form action="/people" class="rounded-2xl border border-stone-200 bg-white p-4 shadow-sm" id="people-search" method="get">
      <label class="block text-sm font-medium text-stone-700" for="q">Search by name, email, or phone</label>
      <div class="mt-3 flex flex-col gap-3 sm:flex-row">
        <input
          class="w-full rounded-xl border border-stone-300 bg-stone-50 px-4 py-3 text-sm outline-none ring-0 placeholder:text-stone-400 focus:border-teal-600"
          hx-get="/people"
          hx-include="#people-search"
          hx-push-url="true"
          hx-target="#people-results"
          hx-trigger="keyup changed delay:50ms, search"
          hx-vals='{"offset": 0}'
          id="q"
          name="q"
          placeholder="Search people"
          type="search"
          autocomplete="off"
          value="{{ query }}"
        >
        <button class="rounded-xl bg-teal-700 px-5 py-3 text-sm font-medium text-white" type="submit">Search</button>
      </div>
      <p class="mt-3 text-xs text-stone-500">Results refresh after a short pause while typing.</p>
    </form>

    <div class="grid gap-4" id="people-results">
      {% include "components/people_results.html" %}
    </div>
  </section>
{% endblock %}
