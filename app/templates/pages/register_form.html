{% extends "layouts/base.html" %}

{% block content %}
  <section class="mx-auto max-w-3xl space-y-6">
    <header class="rounded-[2rem] bg-linear-to-br from-sky-700 to-sky-900 p-8 text-white shadow-sm">
      <p class="text-sm uppercase tracking-[0.25em] text-sky-100">Volunteer registration</p>
      <h2 class="mt-2 text-4xl font-semibold">Complete your details</h2>
      <p class="mt-2 text-sm text-sky-100">Invitation for {{ registration.email }}</p>
    </header>

    <section class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm">
      {% if submitted %}
        <div class="rounded-2xl bg-teal-50 p-5 text-sm text-teal-900">
          Your details have been submitted. A group leader can now approve you into the personnel database.
        </div>
      {% endif %}

      <form action="/register/{{ registration.token }}" class="mt-4 grid gap-4 md:grid-cols-2" method="post">
        <label class="text-sm font-medium text-stone-700">
          First name
          <input class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3" name="first_name" type="text" value="{{ registration.first_name or '' }}">
        </label>
        <label class="text-sm font-medium text-stone-700">
          Last name
          <input class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3" name="last_name" type="text" value="{{ registration.last_name or '' }}" required>
        </label>
        <label class="text-sm font-medium text-stone-700">
          Phone
          <input class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3" name="phone" type="text" value="{{ registration.phone or '' }}">
        </label>
        <label class="text-sm font-medium text-stone-700">
          Birth date
          <input class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3" name="birth_date" type="date" value="{{ registration.birth_date.isoformat() if registration.birth_date else '' }}">
        </label>
        <label class="text-sm font-medium text-stone-700">
          Gender
          <select class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3" name="gender">
            {% for gender in ["A", "K", "M"] %}
              <option value="{{ gender }}" {% if registration.gender == gender %}selected{% endif %}>{{ gender }}</option>
            {% endfor %}
          </select>
        </label>
        <label class="text-sm font-medium text-stone-700">
          Employment status
          <input class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3" name="employment_status" type="number" value="{{ registration.employment_status if registration.employment_status is not none else '' }}">
        </label>
        <label class="text-sm font-medium text-stone-700 md:col-span-2">
          Address
          <input class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3" name="address" type="text" value="{{ registration.address or '' }}">
        </label>
        <label class="text-sm font-medium text-stone-700">
          Postal code
          <input class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3" name="postal_code" type="text" value="{{ registration.postal_code or '' }}">
        </label>
        <div class="md:col-span-2">
          <button class="rounded-xl bg-stone-900 px-5 py-3 text-sm font-medium text-white" type="submit">Submit registration</button>
        </div>
      </form>
    </section>
  </section>
{% endblock %}
