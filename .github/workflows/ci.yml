name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          uv sync --locked
          bun install --frozen-lockfile

      - name: Build assets
        run: make assets

      - name: Lint
        run: make lint

      - name: Import boundaries
        run: make lint-imports

      - name: Test
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/kvarteret-personal-tests.db
        run: make test

      - name: OpenAPI contract
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/kvarteret-personal-openapi.db
        run: make openapi-check

      - name: Dependency audit
        run: make audit

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kvarteret_personal
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kvarteret_personal
      PGDATABASE: kvarteret_personal
      PGHOST: localhost
      PGPASSWORD: postgres
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Prepare Supabase-compatible schemas
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                  CREATE ROLE anon NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                  CREATE ROLE authenticated NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
                  CREATE ROLE service_role NOLOGIN;
              END IF;
          END
          $$;

          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$ SELECT NULL::uuid $$;

          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
              id text PRIMARY KEY,
              name text NOT NULL,
              public boolean NOT NULL DEFAULT false,
              file_size_limit bigint,
              allowed_mime_types text[]
          );
          CREATE TABLE IF NOT EXISTS storage.objects (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              bucket_id text NOT NULL,
              name text
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          SQL

      - name: Apply migrations from empty database
        run: make migrate

      - name: Check schema drift
        run: make schema-drift
