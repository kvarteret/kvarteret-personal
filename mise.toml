# Tool pins for working directly in this repo.
# Versions must match ../infra/mise.toml (infra is the source of truth;
# `mise run doctor` there flags drift).

[settings]
experimental = true

[tools]
fnox = "1.35.1"
infisical = "0.43.138"
age = "1.3.2"
python = "3.13.14"
uv = "0.11.21"
bun = "1.3.14"

# Puts the `kvarteret` / `kv` CLI on PATH when inside this repo.
# The CLI lives in the sibling infra repo (see ../infra); clone it
# beside this checkout and run `mise install` there first.
[env]
_.path = ["{{config_root}}/../infra/bin"]

# Project dependencies are managed by mise's built-in deps providers
# (run `mise deps` / `mise deps install`). auto=true re-checks them before
# every `mise run` / `mise x`.
[deps.uv]
auto = true

[deps.bun]
auto = true

[tasks."deps:update"]
description = "Update Python and JavaScript lockfiles to latest allowed versions"
run = [
  "uv lock",
  "uv sync",
  "bun update",
]

[tasks.dev]
description = "Start Postgres, migrate and seed, then run the app and CSS watcher"
run = [
  "docker compose -f docker-compose.dev.yml up -d db",
  "mise -C ../infra exec -- python scripts/task.py personal uv run python scripts/dev/bootstrap.py",
  "mise run --output prefix dev:css ::: dev:server",
]

[tasks."dev:css"]
description = "Watch and rebuild Tailwind CSS"
run = "bun --no-env-file run watch:css"

[tasks."local"]
description = "Run locally; --db local (default) or prod, optionally --integrations"
run = "mise -C ../infra run personal:local --"

[tasks."dev:server"]
description = "Run the FastAPI development server with reload"
run = "mise -C ../infra exec -- python scripts/task.py personal uv run uvicorn app.main:create_app --factory --reload --host 127.0.0.1 --port 8000"

[tasks.prod]
description = "Run Personal with explicit Infisical production credentials"
run = """
mise -C ../infra run secrets:check -- personal prod
bun --no-env-file run build:css
bun --no-env-file run watch:css &
css_pid=$!
trap 'kill "$css_pid" 2>/dev/null || true' EXIT INT TERM
mise -C ../infra run secrets:exec -- --cwd "{{config_root}}" personal prod -- uv run --no-sync uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000
"""

[tasks."secrets:check"]
description = "Check Infisical production access without displaying values"
run = "mise -C ../infra run secrets:check -- --local-runtime personal prod"

[tasks."secrets:exec"]
description = "Run COMMAND with Infisical production configuration from Infisical"
run = "mise -C ../infra run secrets:exec -- --local-runtime --cwd \"{{config_root}}\" personal prod"
