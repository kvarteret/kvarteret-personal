# SonarQube project configuration for kvarteret-personal
sonar.projectKey=kvarteret-personal
sonar.projectName=Kvarteret Personal

# Sources
sonar.sources=app
sonar.tests=tests

# Python
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# JavaScript / TypeScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/.venv/**,**/.vercel/**,**/alembic/**,**/.vercel_python_packages/**,app/static/css/output.css,app/static/js/vercel-observability.js,**/templates/emails/compiled/**,**/templates/emails/previews/**
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3516
sonar.issue.ignore.multicriteria.e1.resourceKey=app/domain/events/repository.py

# Encoding
sonar.sourceEncoding=UTF-8
